    <text x="194.0" y="154" text-anchor="middle" fill="#adbac7">Volatility</text>
  </g>
  <g class="chipHL" style="animation-delay:3.8s">
    <rect x="147" y="136" width="94" height="27" rx="13" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".6" />
    <text x="194.0" y="154" text-anchor="middle" fill="#3fb950">Volatility</text>
  </g>
  <g class="chip" style="animation-delay:1.03s">
    <rect x="248" y="136" width="87" height="27" rx="13" fill="#ffffff" fill-opacity="0.03" stroke="#343b43" />
    <text x="291.5" y="154" text-anchor="middle" fill="#adbac7">Execution</text>
  </g>
  <g class="chipHL" style="animation-delay:6.0s">
    <rect x="248" y="136" width="87" height="27" rx="13" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".6" />
    <text x="291.5" y="154" text-anchor="middle" fill="#3fb950">Execution</text>
  </g>
  <g class="chip" style="animation-delay:1.12s">
    <rect x="342" y="136" width="120" height="27" rx="13" fill="#ffffff" fill-opacity="0.03" stroke="#343b43" />
    <text x="402.0" y="154" text-anchor="middle" fill="#adbac7">Microstructure</text>
  </g>
  <g class="chipHL" style="animation-delay:8.2s">
    <rect x="342" y="136" width="120" height="27" rx="13" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".6" />
    <text x="402.0" y="154" text-anchor="middle" fill="#3fb950">Microstructure</text>
  </g>
  <g class="chip" style="animation-delay:1.21s">
    <rect x="469" y="136" width="127" height="27" rx="13" fill="#ffffff" fill-opacity="0.03" stroke="#343b43" />
    <text x="532.5" y="154" text-anchor="middle" fill="#adbac7">Low-latency C++</text>
  </g>
  <g class="chipHL" style="animation-delay:10.4s">
    <rect x="469" y="136" width="127" height="27" rx="13" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".6" />
    <text x="532.5" y="154" text-anchor="middle" fill="#3fb950">Low-latency C++</text>
  </g>

  <line class="axis" x1="40" y1="190" x2="860" y2="190" />
  <line class="axis" x1="40" y1="230.0" x2="860" y2="230.0" />

