<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" width="880" height="336" role="img" aria-label="Barinder Singh — quant researcher and developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Barinder Singh</title>
  <defs>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="railFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="1" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.15" />
    </linearGradient>
    <mask id="nameWipe">
      <rect class="wipe" x="40" y="24" width="620" height="56" fill="#fff" />
    </mask>
  </defs>

  <style>
    .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
             font-size: 47px; font-weight: 800; letter-spacing: -1.5px; fill: #f0f6fc; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
             font-size: 16px; fill: #9198a1;
             animation: rise .8s cubic-bezier(.16,.84,.34,1) .55s backwards; }
    .chip text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
                  font-size: 12.5px; font-weight: 500; letter-spacing: .1px; }
    .chip { animation: pop .55s cubic-bezier(.16,.84,.34,1) backwards; }
    .chipHL text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
                    font-size: 12.5px; font-weight: 600; letter-spacing: .1px; }
    .chipHL { opacity: 0; animation: cycle 11.0s ease-in-out infinite; }
    .rail { transform-box: fill-box; transform-origin: top center;
             animation: grow .9s cubic-bezier(.16,.84,.34,1) .1s backwards; }
    .wipe { transform-box: fill-box; transform-origin: left center;
             animation: wipe 1s cubic-bezier(.16,.84,.34,1) .25s backwards; }
    .axis { stroke: #2d333b; stroke-width: 1; stroke-dasharray: 3 5; opacity: .7;
             animation: fade .7s ease 1.3s backwards; }
    .base { stroke: #2d333b; stroke-width: 1; animation: fade .7s ease 1.3s backwards; }
    .area { fill: url(#areaFill); animation: fade 1s ease 4.5s backwards; }
    .tick { fill: none; stroke: #3fb950; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round;
             stroke-dasharray: 908; stroke-dashoffset: 0;
             animation: draw 3s linear 1.5s backwards; }
    .head { animation: fade .4s ease 4.5s backwards; }
    .pill { transform-box: fill-box; transform-origin: left center;
             animation: pop .6s cubic-bezier(.16,.84,.34,1) 4.7s backwards; }
    .pill rect { fill: #3fb950; fill-opacity: .11; stroke: #3fb950; stroke-opacity: .45; }
    .pill text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
                  font-size: 12.5px; font-weight: 600; fill: #3fb950; }
    .caption { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
                font-size: 11.5px; fill: #6e7681; letter-spacing: .3px;
                animation: fade .8s ease 5s backwards; }
    .rule { stroke: #21262d; stroke-width: 1; }

    @keyframes wipe { from { transform: scaleX(0); } }
    @keyframes grow { from { transform: scaleY(0); } }
    @keyframes draw { from { stroke-dashoffset: 908; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes pop  { from { opacity: 0; transform: translateY(7px); } }
    @keyframes cycle { 0%,100% { opacity: 0; } 3% { opacity: 1; } 16.0% { opacity: 1; } 20.0% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .wipe, .rail, .desc, .chip, .axis, .base, .area, .tick, .head, .pill, .caption { animation: none; }
      .chipHL { animation: none; opacity: 0; }
      .halo { display: none; }
    }
  </style>

  <rect class="rail" x="20" y="26" width="3" height="137" rx="1.5" fill="url(#railFade)" />

  <g mask="url(#nameWipe)">
    <text class="name" x="40" y="66">Barinder Singh</text>
  </g>

  <text class="desc" x="40" y="98">Quant researcher and developer, full-stack engineer,</text>
  <text class="desc" x="40" y="120" style="animation-delay:.65s">permanent student of markets.</text>

  <g class="chip" style="animation-delay:0.85s">
