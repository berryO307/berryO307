<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Quant and market systems alongside full-stack software engineering skills">
  <title>Quant and software capabilities</title>
  <rect x="1" y="1" width="998" height="358" rx="18" fill="#0b1220" stroke="#26364b"/>
  <text x="40" y="42" fill="#65d99d" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1.6">CAPABILITIES  /  TWO COMPLEMENTARY DISCIPLINES</text>
  <text x="40" y="79" fill="#f2f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="-.45">Where market thinking meets software delivery</text>

  <rect x="34" y="103" width="452" height="190" rx="12" fill="#111b2c" stroke="#26364b"/>
  <rect x="514" y="103" width="452" height="190" rx="12" fill="#111b2c" stroke="#26364b"/>
  <path d="M 35 116 Q 35 104 47 104 H 473" fill="none" stroke="#47d18c" stroke-width="2.5"/>
  <path d="M 515 116 Q 515 104 527 104 H 953" fill="none" stroke="#64a9ff" stroke-width="2.5"/>

  <text x="56" y="137" fill="#65d99d" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1">01  /  QUANT &amp; MARKET SYSTEMS</text>
  <text x="536" y="137" fill="#8ec2ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1">02  /  FULL-STACK ENGINEERING</text>
  <text x="56" y="159" fill="#91a2b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Study market behavior; build the data path.</text>
  <text x="536" y="159" fill="#91a2b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Turn domain logic into dependable products.</text>

  <g stroke="#26364b" stroke-width="1"><path d="M 56 176 H 464 M 56 213 H 464 M 56 250 H 464"/><path d="M 536 176 H 944 M 536 213 H 944 M 536 250 H 944"/></g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="56" y="195" fill="#d4deeb" font-size="10" font-weight="700" letter-spacing=".75">MARKETS</text><text x="160" y="195" fill="#afbdcf" font-size="12">L2 data · order books · microstructure</text>
    <text x="56" y="232" fill="#d4deeb" font-size="10" font-weight="700" letter-spacing=".75">RESEARCH</text><text x="160" y="232" fill="#afbdcf" font-size="12">MDPs · regime models · simulation</text>
    <text x="56" y="269" fill="#d4deeb" font-size="10" font-weight="700" letter-spacing=".75">SYSTEMS</text><text x="160" y="269" fill="#afbdcf" font-size="12">C++20 · lock-free queues · timing</text>
    <text x="536" y="195" fill="#d4deeb" font-size="10" font-weight="700" letter-spacing=".75">APPLICATIONS</text><text x="647" y="195" fill="#afbdcf" font-size="12">React · TypeScript · Next.js</text>
    <text x="536" y="232" fill="#d4deeb" font-size="10" font-weight="700" letter-spacing=".75">DATA &amp; SERVICES</text><text x="647" y="232" fill="#afbdcf" font-size="12">APIs · PostgreSQL · Node.js</text>
    <text x="536" y="269" fill="#d4deeb" font-size="10" font-weight="700" letter-spacing=".75">DELIVERY</text><text x="647" y="269" fill="#afbdcf" font-size="12">Dashboards · Linux · deployment</text>
  </g>

  <text x="500" y="320" fill="#afbdcf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" text-anchor="middle">One outcome: a market question turned into a usable tool.</text>
  <path d="M 206 339 H 794" stroke="#26364b" stroke-width="2"/>
  <path d="M 206 339 H 794" stroke="url(#capabilityFlow)" stroke-width="2" stroke-dasharray="80 508"/>
