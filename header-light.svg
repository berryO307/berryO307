<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" role="img" aria-label="Barinder Singh — low-latency market data systems and quant research" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Barinder Singh</title>
  <style>
    .name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      font-size: 44px; font-weight: 800; letter-spacing: -1.2px; fill: #161b22;
      animation: rise .7s cubic-bezier(.2,.7,.3,1) .1s backwards;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      font-size: 15px; fill: #59636e;
      animation: rise .7s cubic-bezier(.2,.7,.3,1) .35s backwards;
    }
    .readout {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px; fill: #59636e; letter-spacing: .3px;
      animation: fade .7s ease 3.15s backwards;
    }
    .readout .val { fill: #1a7f37; font-weight: 600; }
    .grid { stroke: #e4e8ec; stroke-width: 1; }
    .rule { stroke: #d8dee4; stroke-width: 1; }
    .tick {
      fill: none; stroke: #1a7f37; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1070; stroke-dashoffset: 0;
      animation: draw 2.9s linear .3s backwards;
    }
    .head { animation: fade .3s linear 3.05s backwards; }
    @keyframes draw { from { stroke-dashoffset: 1070; } }
    @keyframes rise { from { opacity: 0; transform: translateY(9px); } }
    @keyframes fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .name, .tagline, .readout, .head, .tick { animation: none; }
      .halo { display: none; }
    }
  </style>

